---
name: bluenoc
description: Fedora Silverblue with Niri and Noctalia
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - "systemctl --global enable topgrade.timer"

  - type: dnf
      repos:
        files:
          - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
          - https://pkg.claude-desktop-debian.dev/rpm/claude-desktop.repo
    install:
      packages:
        # compositor
        - niri
        - xwayland-satellite
        # shell
        - noctalia-shell
        # terminal
        - kitty
        # other
        - keyd
        - wl-mirror
        - network-manager-applet
        - wtype
        - claude-desktop
    remove:
      packages:
        - gnome-software
        - gnome-tour
        - gnome-system-monitor
        - gnome-classic-session
        - gnome-initial-setup
        - gnome-user-docs
        - gnome-user-share
        - gnome-remote-desktop
        - yelp
        - yelp-libs
        - yelp-xsl
        - malcontent-control
        - firefox
        - firefox-langpacks
        - ptyxis
        - nvtop
        - nano
        - b43-fwcutter
        - b43-openfwwf
        - brcmfmac-firmware

  - type: containerfile
    snippets:
      - RUN dnf install -y --setopt=tsflags=noscripts displaylink && dnf clean all
      # Build the evdi kmod against whatever kernel the image ships, and bake it in
      - |
        RUN KVER="$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core | tail -n1)" && \
            dnf install -y "kernel-devel-${KVER}" akmod-evdi && \
            akmods --force --kernels "${KVER}" --kmod evdi && \
            dnf install -y /var/cache/akmods/evdi/kmod-evdi-*.rpm && \
            depmod -a "${KVER}" && \
            dnf remove -y "kernel-devel-${KVER}" && \
            dnf clean all && rm -rf /var/cache/akmods/*

  - type: brew
    brew-analytics: false

  - type: signing
